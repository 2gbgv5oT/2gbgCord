        /* مؤشر الماوس المتحرك المخصص بالـ GIF */

            left: 0;
            width: 45px;

            background-position: center;
            background-size: contain;
            pointer-events: none;
            transform: translate(-15%, -15%);
            z-index: 2147483647;
            filter: drop-shadow(0 0 8px rgba(88, 101, 242, 0.8));
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes floatAnime {
            0% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }

            100% {
                transform: translateY(0px) rotate(0deg);
            }

        .top-banner-gif {

    <!-- جافاسكريبت لحركة مؤشر الماوس وجلب عدد الزيارات -->
    <script>
        const cursor = document.getElementById('custom-cursor');

        window.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        document.addEventListener('mouseleave', () => {
            cursor.style.opacity = '0';
        });
        document.addEventListener('mouseenter', () => {
            cursor.style.opacity = '1';
        });

        // كود العداد الحي للزيارات (يزيد تلقائياً مع كل زائر جديد)
        fetch('https://api.counterapi.dev/v1/2gbg-v5ot-cord/visits/up')
            .then(res => res.json())
            .then(data => {
                document.getElementById('visit-count').textContent = data.count;
            })
            .catch(() => {
                document.getElementById('visit-count').textContent = '0';
            });
    </script>
